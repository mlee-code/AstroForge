<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>AstroForge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header><a class="brand" href="./">ASTRO<span>FORGE</span></a><p>Sobreviva. Forje seu recorde.</p></header>
      <section class="game-card" aria-label="Jogo AstroForge">
        <canvas id="game" width="960" height="600" aria-label="Área do jogo"></canvas>
        <div class="hud" aria-live="polite">
          <div><small>PONTOS</small><strong id="score">000000</strong></div>
          <div><small>VIDAS</small><strong id="lives">3</strong></div>
          <div><small>NÍVEL</small><strong id="level">1</strong></div>
        </div>
        <div id="overlay" class="overlay">
          <section id="main-menu" class="menu-screen">
            <h1>ASTRO<span>FORGE</span></h1><p>Uma oficina espacial entre você e o vazio.</p>
            <button class="menu-action" data-screen="new-game" type="button">NOVO JOGO</button>
            <button class="menu-action" data-screen="continue-game" type="button">CONTINUAR JOGO</button>
          </section>
          <section id="new-game" class="menu-screen hidden">
            <h2>NOVA MISSÃO</h2><label>Nome <input id="player-name" maxlength="20" placeholder="Piloto" /></label>
            <label>Dificuldade <select id="difficulty"><option>fácil</option><option selected>normal</option><option>difícil</option></select></label>
            <label>Nave <select id="ship-variant"><option value="interceptor">Interceptor</option><option value="cargueiro">Cargueiro</option><option value="sentinela">Sentinela</option></select></label>
            <label>Seed visual <input id="ship-seed" value="astro-01" maxlength="32" /></label>
            <button id="launch" type="button">DECOLAR</button><button class="back" type="button">VOLTAR</button>
          </section>
          <section id="continue-game" class="menu-screen hidden"><h2>CONTINUAR JOGO</h2><label>Nome <input id="continue-name" maxlength="20" placeholder="Piloto" /></label><p id="continue-message"></p><button id="continue" type="button">RECUPERAR MISSÃO</button><button class="back" type="button">VOLTAR</button></section>
          <section id="game-over" class="menu-screen hidden"><h2>GAME OVER</h2><p id="game-over-stats"></p><button id="again" type="button">NOVA MISSÃO</button><button id="home" type="button">MENU PRINCIPAL</button></section>
        </div>
      </section>
      <section class="panels">
        <article><h2>Controles</h2><p><kbd>W</kbd>/<kbd>↑</kbd> impulso · <kbd>A</kbd><kbd>D</kbd> girar · <kbd>Espaço</kbd> disparar · <kbd>P</kbd> pausar</p></article>
        <article><h2>Telemetria</h2><p id="telemetry">Aguardando decolagem.</p></article>
      </section>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
